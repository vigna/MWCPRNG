name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # name, lag, jump and long-jump exponents, and extra flags for test/test.c
  GENERATORS: >-
    MWC128X:1:64:96:
    MWC192X:2:96:144:
    MWC256X:3:128:192:
    GMWC128X:1:64:96:-DGMWC
    GMWC256X:3:128:192:-DGMWC
    MWC64X_32:1:32:48:-DW=32
    MWC128X_32:3:64:96:-DW=32

jobs:
  # The whole test suite with GCC (Linux, x86-64) and Clang (macOS, ARM64)
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test suite
        run: bash prngs/test/check.sh

  # mul_add.h and all generators on a target without 128-bit integers
  # (32-bit x86), where mul_add() uses the schoolbook multiplication
  x86-32:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prngs
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit libraries
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: mul_add.h
        run: |
          gcc -m32 -O2 -std=c99 -Wall -Wextra -pedantic -Werror -I. test/mul_add.c -o mul_add
          ./mul_add
      - name: Generators
        run: |
          set -e
          mkdir -p out
          for g in $GENERATORS; do
            IFS=: read -r name k je le extra <<< "$g"
            gcc -m32 -O2 -std=c99 -Wall -Wextra -Wno-unused-function -Werror -I. -DGENFILE="\"$name.c\"" -DK=$k -DJE=$je -DLE=$le $extra test/test.c -o t
            ./t > out/$name.out
            tail -n 3 out/$name.out | sed "s/^/$name: /"
          done
          if grep -q FAIL out/*.out; then exit 1; fi
          python3 test/check.py out

  # mul_add.h and all generators with Microsoft's compiler, where mul_add()
  # uses _umul128() on x64 and __umulh() on ARM64
  msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: prngs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: mul_add.h
        run: |
          set -e
          cl 2>&1 | head -n 1
          for d in "" -DMUL_ADD_PORTABLE; do
            cl -nologo -O2 -W4 -WX -std:c11 $d -I. test/mul_add.c -Fe:mul_add_c.exe
            ./mul_add_c.exe
            cl -nologo -O2 -W4 -WX -TP -EHsc $d -I. test/mul_add.c -Fe:mul_add_cpp.exe
            ./mul_add_cpp.exe
          done
      - name: Generators
        run: |
          set -e
          mkdir -p out
          for g in $GENERATORS; do
            IFS=: read -r name k je le extra <<< "$g"
            cl -nologo -O2 -W3 -WX -std:c11 -I. "-DGENFILE=\"$name.c\"" -DK=$k -DJE=$je -DLE=$le $extra test/test.c -Fe:t.exe
            ./t.exe > out/$name.out
            tail -n 3 out/$name.out | sed "s/^/$name: /"
          done
          if grep -q FAIL out/*.out; then exit 1; fi
          python test/check.py out
